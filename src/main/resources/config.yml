# ============================================================
#  风滚草 (Tumbleweed) 插件配置
# ============================================================
#  设计原则:能用 MythicMobs 配置表达的功能一律在 MM 配置中调整:
#   - 怪物属性 / 血量 / 伤害免疫        -> plugins/MythicMobs/Mobs/Tumbleweed.yml
#   - 践踏农田 / 掉落表                 -> plugins/MythicMobs/Mobs/Tumbleweed.yml
#   - 骷髅射击风滚草 AI                 -> plugins/MythicMobs/Mobs/Skeleton.yml
#   - 3D 模型 / 纹理                    -> plugins/ModelEngine/blueprints/tumbleweed.bbmodel
#  自然生成由本插件按原版 mod 的 Spawner 逻辑实现 (下方 spawner 段),
#  经 MythicMobs API 创建实体,怪物属性/践踏/掉落仍由 MM 配置驱动。
#  本文件只保留插件自身物理相关的参数。
# ============================================================

# 风力倍率 (原版 mod 的 windMultiplier)。1.0 = 原版强度。
# 调大 -> 风滚草滚得更快;调小 -> 更慢。
wind-multiplier: 1.0

# 首次启动时是否把内嵌的 MythicMobs 配置与 ModelEngine 蓝图
# 自动导出到插件目录 (已存在的文件不会被覆盖)。
auto-export-resources: true

# ============================================================
#  自然生成 (原版 mod 1.14 Spawner 逻辑,插件实现)
# ============================================================
#  生成规则固定对齐原版,其余细节 (非配置项):
#   - 每 10 秒对每个世界检查一次,受 domobspawning 游戏规则控制
#   - 候选范围:每个非旁观玩家所在区块周围 ±8 区块 (排除角落),
#     世界边界内,区块中心群系为干燥/沙地群系
#   - 生成点:必须落在干灌木 (dead_bush) 上且可见天空,±5 格找位
#     尝试最多 10 次;生成点 32 格内无玩家、世界出生点 24 格外
#   - 20% 概率一次生成两只;实体尺寸随机 1~4
#  注意:若服务器上残留旧版导出的 plugins/MythicMobs/Spawners/
#  TumbleweedSpawner.yml,请手动删除,否则会与本生成器双重生成。
spawner:
  enabled: true          # 是否启用自然生成
  chance: 0.5            # 每个候选区块的生成概率 (原版 spawnChance: 0.5)
  max-per-player: 8      # 每玩家数量上限 (原版 maxPerPlayer: 8,按候选区比例折算)

# ============================================================
#  性能优化 (对应原版 1.14 ServerEntityMixin 的同步精简思路)
# ============================================================
#  距最近玩家超过 distant-physics-distance 格的风滚草处于所有玩家
#  视距之外 (不可见),物理与渲染同步降频为每 distant-physics-interval
#  tick 一次,可显著降低 ModelEngine 数据包与物理开销;玩家靠近后
#  自动恢复全速,视觉上无感知。寿命按真实时间补偿,不会变长。
#  注:脱管检查 (110 格) 不受降频影响,仍每 tick 执行。
performance:
  distant-physics-distance: 96   # 0 = 关闭远处降频
  distant-physics-interval: 4    # 每 N tick 运行一次物理与渲染同步

  # 使用 CraftEngine 的可见性判定 (视锥 + 方块遮挡采样) 优化同步:
  # 在玩家视锥外或被方块遮挡的风滚草进入降频 (比单纯球半径更省包)。
  # 玩家近处的风滚草由 CE 判定自动保持全速 (视锥内必然可见),无需额外配置。
  # 需在服务器安装 CraftEngine,未安装时自动回退为上方纯距离降频,行为完全一致。
  # 风滚草直接注册进 CE 的实体剔除系统,判定由 CE 自己的异步线程池
  # (50ms 周期 + CAS 防重入 + 玩家分片)执行,不占服务器主线程。
  # 注:请同时执行 /ce reload all 让 CE 完成资源加载后再启用本插件。
  culling-enabled: true          # 是否使用 CE 可见性判定

