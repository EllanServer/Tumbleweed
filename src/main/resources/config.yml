# ============================================================
#  风滚草 (Tumbleweed) 插件配置
# ============================================================
#  设计原则:能用 MythicMobs 配置表达的功能一律在 MM 配置中调整:
#   - 怪物属性 / 血量 / 伤害免疫        -> plugins/MythicMobs/Mobs/Tumbleweed.yml
#   - 践踏农田 / 掉落表                 -> plugins/MythicMobs/Mobs/Tumbleweed.yml
#   - 骷髅射击风滚草 AI                 -> plugins/MythicMobs/Mobs/Skeleton.yml
#   - 自然生成 (生物群系/概率/距离)      -> plugins/MythicMobs/Spawners/TumbleweedSpawner.yml
#   - 3D 模型 / 纹理 / 渲染与交互        -> plugins/CraftEngine/resources/tumbleweed/
#     (家具定义 configuration/furniture/tumbleweed.yml,
#      模型 resourcepack/assets/tumbleweed/models/item/tumbleweed.json)
#  本文件只保留插件自身物理相关的参数。
# ============================================================

# 风力倍率 (原版 mod 的 windMultiplier)。1.0 = 原版强度。
# 调大 -> 风滚草滚得更快;调小 -> 更慢。
wind-multiplier: 1.0

# 首次启动时是否把内嵌的 MythicMobs 配置与 CraftEngine 家具包
# 自动导出到插件目录 (已存在的文件不会被覆盖;CE 资源需 /ce reload all 生效)。
auto-export-resources: true

# ============================================================
#  性能优化 (对应原版 1.14 ServerEntityMixin 的同步精简思路)
# ============================================================
#  距最近玩家超过 distant-physics-distance 格的风滚草处于所有玩家
#  视距之外 (不可见),物理与家具同步降频为每 distant-physics-interval
#  tick 一次,可显著降低物理开销与 CE 家具同步包;玩家靠近后
#  自动恢复全速,视觉上无感知。寿命按真实时间补偿,不会变长。
#  注:脱管检查 (110 格) 不受降频影响,仍每 tick 执行。
performance:
  distant-physics-distance: 96   # 0 = 关闭远处降频
  distant-physics-interval: 4    # 每 N tick 运行一次物理与渲染同步
