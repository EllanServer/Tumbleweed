# ============================================================
#  风滚草 - MythicMobs 怪物定义 (配置化,插件只负责物理)
# ============================================================
Tumbleweed:
  Type: PIG
  Display: "<#d3a95c>风滚草"
  Health: 1
  Damage: 0
  Armor: 0
  NoAI: true
  Silent: true
  PreventSunburn: true
  PreventOtherDrops: true
  PreventItemPickup: true
  PreventMobKillDrops: true
  Options:
    Despawn: {F: 0, D: 0}
    PreventRandomEquipment: true
    PreventInfection: true
    PreventRandomTarget: true
    MovementSpeed: 0
    ApplyInvisibility: true
    NoDamageTicks: 1
  DamageModifiers:
  - INVULNERABLE_FALL: 1
  - INVULNERABLE_FIRE: 1
  - INVULNERABLE_LAVA: 1
  - INVULNERABLE_DROWNING: 1
  - INVULNERABLE_EXPLOSION: 1
  Skills:
  - skill:TumbleweedTrample ~onTimer:10 chance=0.7
  Drops:
  - item{name=WHEAT_SEEDS;amount=1-3;chance=0.2}
  - item{name=STICK;amount=1-2;chance=0.25}
  - item{name=DEAD_BUSH;amount=1;chance=0.1}
  - item{name=DIRT;amount=1;chance=0.1}
  - item{name=MUSIC_DISC_13;amount=1;chance=0.05}

TumbleweedTrample:
  Conditions:
  - onground
  - onblock{m=FARMLAND}
  Skills:
  - setblock{m=DIRT;direction=down} @TriggerLocation
  - sound{s=BLOCK_GRAVEL_BREAK;volume=0.8;pitch=0.9} @self
