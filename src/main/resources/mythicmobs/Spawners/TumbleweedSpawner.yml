# ============================================================
#  风滚草生成器 - MythicMobs RandomSpawner (配置化)
# ============================================================
#  等效原版 FabricSpawner:
#   - 玩家周围 20~48 格随机生成  -> MinDistance/MaxDistance
#   - 仅干燥生物群系            -> biomeIn 条件 (沙漠/恶地/热带草原系)
#   - 每 10 秒一次检查          -> DelaySeconds
#   - 20% 概率成双              -> MobAmount: 1-2
#
#  可自行调整 Chance(每次尝试生成概率)、Worlds、生物群系条件。
#  若要限定"干灌木方块上生成",在 Conditions 中追加:
#  - blockIs{m=DEAD_BUSH}
# ============================================================
TumbleweedSpawner:
  Type: RandomSpawner
  Mob: Tumbleweed
  Worlds: [world]
  Chance: 0.1
  Priority: NORMAL
  MobAmount: 1-2
  Attempts: 1
  DelaySeconds: 10
  MinDistance: 20
  MaxDistance: 48
  Conditions:
  - biomeIn{d=desert,badlands,wooded_badlands,eroded_badlands,savanna,savanna_plateau,windswept_savanna}
