# ============================================================
#  风滚草 - MythicMobs 怪物定义 (配置化,插件只负责物理)
#  掉落对照原版 1.20.1 loot_tables/entities/tumbleweed.json:
#   - DropTable TumbleweedDrops: 池内按权重抽 1 (common 6×17 / uncommon 4×7 /
#     rare 2×4 / epic 4×1, 总权重 142) —— 与原版 rolls=1 语义一致
#   - 骷髅系击杀额外掉落 1 张唱片 (原版 creeper_drop_music_discs 池,
#     12 张各 1/12; MM dropitem 独立判定,用 chance=0.0833 近似)
#   - 死亡音效: 原版 playSound(grass break, (vol+1)/2=0.75, pitch*0.8)
#
#  MM5 属性位置注意 (对照官方 wiki Mobs/Options.md):
#   - NoAI / Silent / PreventSunburn / PreventOtherDrops / PreventItemPickup /
#     PreventMobKillDrops / PreventRandomEquipment / Collidable / Invisible /
#     Despawn / MovementSpeed / NoDamageTicks 全部在 Options: 下
#   - MM5 没有 ApplyInvisibility / PreventInfection / PreventRandomTarget
#     (MM4 残留键, 写了会被忽略); Invisible 替代 ApplyInvisibility
#   - Despawn 用模式值 NEVER (插件全权管理 2 分钟寿命 + 160 格脱管)
#   - MM5 音效 s= 参数走 adventure Key 解析, 必须小写
#     (block.grass.break / entity.skeleton.shoot, 大写会抛 InvalidKeyException
#     并把该 ActiveMob 从 MM 追踪移除, 导致后续死亡掉落清空失效)
# ============================================================
Tumbleweed:
  Type: PIG
  Display: "<#d3a95c>风滚草"
  Health: 1
  Damage: 0
  Armor: 0
  Options:
    Despawn: NEVER
    NoAI: true
    Silent: true
    PreventSunburn: true
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventMobKillDrops: true
    PreventRandomEquipment: true
    Collidable: false
    Invisible: true
    MovementSpeed: 0
    NoDamageTicks: 1
  DamageModifiers:
  - ENTITY_ATTACK 999
  - PROJECTILE 999
  - FALL 0
  - FIRE 0
  - LAVA 0
  - DROWNING 0
  - EXPLOSION 0
  Skills:
  # 践踏农田: 原版 FarmlandMixin 在实体坠落撞击 (fallOn) 时 70% 触发;
  # MM5 无 onFall 触发器 (已核对官方 Triggers 目录 38 个触发器), 用 onTimer:5
  # 轮询 + 技能内 fallingspeed{s=>0.3} 条件近似 "坠落中" —— 滚动经过不触发,
  # 与 onblock{FARMLAND} 组合仅在从空中落到农田上时判定;
  # 坠落过程约 2-3 次判定, chance=0.5 使总触发率 ≈64%-88%, 居中贴近原版 70%
  - skill:TumbleweedTrample ~onTimer:5 chance=0.5
  # 死亡音效: 原版 grass break, 音量 0.75, 音调 0.8 (MM5 Key 必须小写)
  - sound{s=block.grass.break;volume=0.75;pitch=0.8} ~onDeath
  # 骷髅系击杀: 原版额外掉落 1 张唱片 (12 选 1, MM 独立判定 chance=1/12 近似)
  # ~onDeath 触发器下 @trigger = 击杀者 (官方 Triggers/onDeath 文档);
  # entitytype 条件过滤骷髅系 (MM5 无 killeris 目标器/条件, 已核对 jar)
  # dropitem 数量按官方文档用空格写法 "物品名 数量" (amount 非通用属性)
  - dropitem{item=MUSIC_DISC_13 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_CAT 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_BLOCKS 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_CHIRP 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_FAR 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_MALL 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_MELLOHI 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_STAL 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_STRAD 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_WARD 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_11 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  - dropitem{item=MUSIC_DISC_WAIT 1} ~onDeath @trigger conditions=[entitytype{types=SKELETON,STRAY,BOGGED}] chance=0.0833
  Drops:
  # MM5 引用 DropTable 直接写表名 (官方 ExampleMobs.yml 格式);
  # 旧写法 - table:xxx 被当 drop type 解析, 报 "Drop type not found"
  - TumbleweedDrops
