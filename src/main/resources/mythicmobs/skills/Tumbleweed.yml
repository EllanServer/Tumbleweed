# ============================================================
#  风滚草相关技能定义
# ============================================================

# --- 风滚草踩踏农田 ---
TumbleweedTrample:
  Conditions:
  - onground
  - onblock{m=FARMLAND}
  Skills:
  - setblock{m=DIRT;direction=down} @TriggerLocation
  - sound{s=BLOCK_GRAVEL_BREAK;volume=0.8;pitch=0.9} @self

# --- 骷髅射击风滚草 ---
ShootTumbleweed:
  Conditions:
  - distance{a=9;b=18}
  - lineofsight
  Skills:
  - look
  - projectile{projectile=ARROW;velocity=32;velocityMode=FORWARD;amount=1;power=1} @MobsInRadius{r=18;limit=1;conditions=[mythicmobtype{type=Tumbleweed}]}
  - sound{s=ENTITY_SKELETON_SHOOT;volume=1;pitch=0.8-1.2} @self
