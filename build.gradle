// Tumbleweed - Paper 26.2 plugin (MythicMobs + CraftEngine furniture integration)
// Groovy DSL:与 Java 25 上的 Gradle 8.14+ 完全兼容 (Kotlin DSL 在 JDK 25 有 class major version 限制)

plugins {
    id 'java'
}

group = 'net.tumbleweed'
version = '1.0.0'
description = 'Tumbleweed - Paper plugin rewrite of the Tumbleweed mod, powered by MythicMobs & CraftEngine'

repositories {
    mavenCentral()
    // Paper API
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    // MythicMobs (Lumine official maven)
    maven { url 'https://mvn.lumine.io/repository/maven-public/' }
    // CraftEngine (MoMi)
    maven { url 'https://repo.momirealms.net/releases' }
}

dependencies {
    // Paper 26.2 API (提供 org.joml 传递依赖)
    compileOnly 'io.papermc.paper:paper-api:26.2.build.87-stable'

    // MythicMobs 5.13.1 (最新,compileOnly)
    compileOnly 'io.lumine:Mythic-Dist:5.13.1-SNAPSHOT'

    // CraftEngine 26.7.4 (最新,compileOnly) - 家具托管渲染 + 交互事件
    compileOnly 'net.momirealms:craft-engine-bukkit:26.7.4'
    compileOnly 'net.momirealms:craft-engine-core:26.7.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('jar') {
    archiveBaseName = 'Tumbleweed'
    archiveVersion = project.version
    from('LICENSE') { into 'META-INF' }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
